{% extends "base.html" %}

{% block title %}Login - TecnoAjuda{% endblock %}

{% block content%}
    <div class="formulario_total">
        <h2>Login de Usuario:</h2>
        <form action="" method="post">
        <fieldset>
            <div class="Nome_email_senha">
            <label for="email">Digite seu e-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail">
            </div>

            <div class="Nome_email_senha">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" maxlength="10" placeholder="••••••">
            </div>

            <div class="button-group">
            <input type="submit" value="Enviar" class="botao btn-enviar">
            <input type="reset" value="Resetar" class="botao btn-reset">
            </div>
        </fieldset>
        </form>
    </div>
{% endblock %}
